# This is the resource bundle for order.conf.orderassistant

#Texts for manifest.json

#XTIT: Application name
appTitle=Order Assistant

#YDES: Application description
appDescription=Ask about order feasibility cases instead of phoning another team. Read-only: it answers with data cards and links to the case apps.

#XTIT: Launchpad tile subtitle
flpSubtitle=Ask about cases

#Texts for the chat page

#XBUT: Starts a new conversation
newConversation=New Conversation

#XFLD: Placeholder of the message input
inputPlaceholder=Ask about a case, a capacity request or a sales order… (Enter to send, Shift+Enter for a new line)

#XBUT: Sends the message
send=Send

#XBUT: Stops the running answer
stop=Stop

#XTIT: Shown above the suggestion buttons of an empty conversation
suggestions=Try asking

#XMSG: Context strip when opened from a case; {0} is the case ID
caseContext=Asking about case {0}. Questions are about this case unless you name another one.

#XMSG: Label of every answer
aiLabel=Generated by AI, check the data cards

#XMSG: Busy text while the assistant is working
thinking=Working…

#XMSG: The assistant finished without text
noAnswer=(no answer)

#XMSG: The answer was stopped by the user
canceled=Stopped.

#XMSG: The request was refused, e.g. by a quota; {0} is the server's message
failed=The Order Assistant could not answer: {0}

#XMSG: The task failed, e.g. the LLM is not available
failedTask=The Order Assistant could not answer right now. Please try again later.

#XMSG: Shown under an error when the assistant was opened from a case
failedCaseLink=You can look the case up in the case app:

#XBUT: Link to a case app; {0} is the case or capacity request ID, {1} the app
openIn=Open {0} in {1}

#XTIT: Case card: lane
lane=Lane

#XTIT: Case card: status
status=Status

#XTIT: Case card: team the case is waiting for
waitingFor=Waiting for

#XTIT: Case card: requested date
requestedDate=Requested

#XTIT: Case card: confirmed date
confirmedDate=Confirmed

#XTIT: Case card: penalty risk
penaltyRisk=Penalty risk

#XFLD: Nobody has to act on the case
nobody=Nobody

#XFLD: Yes
yes=Yes

#XTIT: The assistant is not available for the user
noAgentTitle=Order Assistant not available

#XMSG: The assistant is not available for the user
noAgentText=The Order Assistant needs the Sales, Supply Chain Planner or Production Planner role.

#XMSG: The assistant is loading
loading=Loading the Order Assistant…

#XMSG: A link can't be opened here; {0} is the intent
openInLaunchpad=Open this in the launchpad: {0}

#XTIT: Title of the case apps, by intent (for the link back when an answer fails)
appFeasibilityCase-track=Sales Order Feasibility
appFeasibilityCase-plan=Supply Planning Workbench
appCapacityRequest-decide=Production Capacity Workbench
